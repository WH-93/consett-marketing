<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#D65A1F">
  <meta name="description" content="Dog-friendly pubs, cafes, walks, vets, and groomers in Margate, Thanet. Interactive map curated by Amble Dogs.">
  <title>Dog-Friendly Margate — Amble Dogs</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="app.css">

  <!-- Open Graph (for social sharing) -->
  <meta property="og:title" content="Dog-Friendly Margate — Interactive Map">
  <meta property="og:description" content="Find pubs, cafes, walks, vets & groomers that welcome dogs in Margate and Thanet. Curated by Amble Dogs.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ambledogs.co.uk/dog-friendly-margate/">
</head>
<body>

  <!-- Map -->
  <div id="map"></div>
  <div class="map-dim" id="mapDim"></div>

  <!-- Near Me button -->
  <div class="map-controls">
    <button class="btn-near-me" id="btnNearMe" onclick="locateMe()" aria-label="Find near me">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <circle cx="12" cy="12" r="3"/>
        <line x1="12" y1="2" x2="12" y2="6"/>
        <line x1="12" y1="18" x2="12" y2="22"/>
        <line x1="2" y1="12" x2="6" y2="12"/>
        <line x1="18" y1="12" x2="22" y2="12"/>
      </svg>
    </button>
  </div>

  <!-- Filter pills -->
  <div class="filter-bar" id="filterBar"></div>

  <!-- Bottom sheet -->
  <div class="sheet" id="sheet">
    <div class="sheet-handle" id="sheetHandle"></div>
    <div class="sheet-header" id="sheetHeader">
      <span>Nearby dog-friendly places</span>
      <span class="sheet-count" id="sheetCount"></span>
    </div>
    <div class="venue-list" id="venueList">
      <!-- Loading skeleton -->
      <div class="loading-skeleton">
        <div class="skeleton-row"></div>
        <div class="skeleton-row"></div>
        <div class="skeleton-row"></div>
        <div class="skeleton-row"></div>
        <div class="skeleton-row"></div>
      </div>
    </div>
    <div class="quick-view" id="quickView" style="display:none;"></div>
    <div class="sheet-footer" id="sheetFooter">
      Curated by <a href="https://ambledogs.co.uk" target="_blank">Amble Dogs</a>
      — solo & small-group walks in Margate
    </div>
  </div>

  <!-- Venue detail -->
  <div class="detail-view" id="detailView"></div>

  <!-- Suggest venue modal -->
  <div class="suggest-modal" id="suggestModal" onclick="closeSuggestModal()">
    <div class="suggest-form" onclick="event.stopPropagation()">
      <h3>Suggest a venue</h3>
      <input type="text" id="suggestName" placeholder="Venue name" required>
      <select id="suggestCategory">
        <option value="pub">🍺 Pub</option>
        <option value="cafe">☕ Cafe / Restaurant</option>
        <option value="vet">🏥 Vet</option>
        <option value="walk">🐾 Walking route</option>
        <option value="groomer">✂️ Groomer</option>
        <option value="pet-shop">🦴 Pet shop</option>
      </select>
      <textarea id="suggestPolicy" placeholder="What's the dog policy? (e.g. dogs welcome inside, water bowls provided)"></textarea>
      <button onclick="submitSuggestion()">Send suggestion</button>
      <div style="text-align:center;margin-top:8px;font-size:13px;color:var(--grey-400);">
        We verify all submissions before adding them to the map.
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
